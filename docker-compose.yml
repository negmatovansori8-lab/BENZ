services:
  postgres:
    image: postgres:16-alpine
    container_name: autohub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autohub
    ports:
      - "5432:5432"
    volumes:
      - autohub_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autohub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autohub_pgdata:
